<!doctype html>
<html lang="en" class="scrollbar-thin scrollbar-track-zinc-800 scrollbar-thumb-zinc-500">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rizky Maulana | Portfolio</title>

    <!-- Icon -->
     <link rel="shortcut icon" href="/public/assets/favicon.ico" type="image/svg+xml">

     <!-- Font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

     <!-- Symbol -->
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });
    </script>

    <script>
      document.addEventListener('keydown', function(e) {
      
        if (e.key === "F12") {
          e.preventDefault();
        }
      
        if (e.ctrlKey && e.shiftKey && e.key === "I") {
          e.preventDefault();
        }
      
        if (e.ctrlKey && e.shiftKey && e.key === "C") {
          e.preventDefault();
        }
      
        if (e.ctrlKey && e.key === "U") {
          e.preventDefault();
        }
      
      });
    </script>

    <script>
      setInterval(function() {
        if (window.outerWidth - window.innerWidth > 200 || window.outerHeight - window.innerHeight > 200) {
          document.body.innerHTML = "DevTools detected.";
        }
      }, 1000);
    </script>

    <script>
      document.addEventListener('dragstart', function(e) {
        e.preventDefault();
      });
    </script>
  </body>
</html>
