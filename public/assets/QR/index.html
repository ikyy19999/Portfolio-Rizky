<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced QR Code Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%233b82f6'><rect x='10' y='10' width='30' height='30'/><rect x='60' y='10' width='30' height='30'/><rect x='10' y='60' width='30' height='30'/></svg>">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --hover-color: #2563eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(145deg, var(--bg-primary), var(--bg-secondary));
            color: var(--text-primary);
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background-color: var(--bg-secondary);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 30px;
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background-color: var(--bg-primary);
            border: none;
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-color);
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            background-color: var(--accent-color);
            color: var(--text-primary);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            background-color: var(--hover-color);
            transform: translateY(-3px);
        }

        button:active {
            transform: translateY(0);
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #qrcode canvas {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .hidden {
            display: none !important;
        }

        #backButton {
            width: 100%;
            margin-top: 20px;
        }

        footer {
            margin-top: 20px;
            color: var(--text-secondary);
            text-align: center;
            font-size: 14px;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .button-container {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Advanced QR Code Generator</h2>
        <input 
            type="text" 
            id="text" 
            placeholder="Enter text or URL to generate QR code"
            maxlength="500"
        >
        <div class="button-container">
            <button onclick="generateQRCode()">Generate QR Code</button>
            <button id="resetButton" class="hidden" onclick="resetQRCode()">Reset</button>
            <button id="shareButton" class="hidden" onclick="shareQRCode()">Share</button>
        </div>
        <div id="qrcode"></div>
        <button id="backButton" onclick="goBack()">Back to Page</button>
        <footer>
            <p>&copy; <span id="currentYear"></span> Rizky Maulana. All Rights Reserved.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        const qrCodeContainer = document.getElementById('qrcode');
        const resetButton = document.getElementById('resetButton');
        const shareButton = document.getElementById('shareButton');
        const textInput = document.getElementById('text');

        // Update the year in the footer
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        function generateQRCode() {
            const qrText = textInput.value.trim();
            qrCodeContainer.innerHTML = '';

            if (qrText) {
                new QRCode(qrCodeContainer, {
                    text: qrText,
                    width: 250,
                    height: 250,
                    colorDark: "#ffffff",
                    colorLight: "#1e293b",
                    correctLevel: QRCode.CorrectLevel.H
                });
                resetButton.classList.remove('hidden');
                shareButton.classList.remove('hidden');
            } else {
                alert('Please enter a valid text or URL');
            }
        }

        function resetQRCode() {
            qrCodeContainer.innerHTML = '';
            textInput.value = '';
            resetButton.classList.add('hidden');
            shareButton.classList.add('hidden');
        }

        async function shareQRCode() {
            const canvas = qrCodeContainer.querySelector('canvas');
            if (navigator.share && canvas) {
                canvas.toBlob(async (blob) => {
                    try {
                        const file = new File([blob], 'qrcode.png', { type: 'image/png' });
                        await navigator.share({
                            files: [file],
                            title: 'QR Code',
                            text: 'Here is the QR code I generated!',
                        });
                    } catch (error) {
                        console.error('Sharing failed', error);
                        alert('Sharing failed: ' + error.message);
                    }
                });
            } else {
                alert('Your browser does not support the Web Share API.');
            }
        }

        function goBack() {
            window.history.back ();
        }
    </script>
</body>
</html>
