<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            'sans': ['Poppins', 'ui-sans-serif', 'system-ui']
          },
          colors: {
            'brand-purple': '#8A4FFF',
            'brand-pink': '#FF6B9E',
            'brand-bg': '#F5F5F9',
            'dark-bg': '#121212',
            'dark-surface': '#1E1E1E',
          }
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #8A4FFF;
      border-radius: 10px;
    }

    @media (min-width: 640px) {
      ::-webkit-scrollbar {
        width: 8px;
      }
    }

    .dark .text-gray-700 {
      color: #e5e7eb;
    }
    .dark .text-gray-900 {
      color: #f9fafb;
    }
    .dark .text-gray-100 {
      color: #1f2937;
    }

    .dark input::placeholder,
    .dark select {
      color: #e5e7eb;
    }

    .dark input,
    .dark select {
      background-color: #374151;
      color: #e5e7eb;
    }
  </style>
</head>
<body class="bg-brand-bg dark:bg-dark-bg text-gray-900 dark:text-gray-100 min-h-screen">
  <!-- Login/Register Section -->
  <div class="container mx-auto px-4 py-8 max-w-6xl">
    <div class="bg-white dark:bg-dark-surface rounded-2xl p-6 shadow-xl max-w-md mx-auto">
      <h1 class="text-2xl font-bold text-center text-brand-purple dark:text-brand-pink mb-6">Finance Tracker</h1>
      <div id="loginForm">
        <h2 class="text-xl font-semibold mb-4 text-center">Login</h2>
        <form id="loginForm" class="space-y-4">
          <div>
            <label for="loginUsername" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Username</label>
            <input id="loginUsername" type="text" class="w-full p-3 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-brand-purple" placeholder="Enter username" required>
          </div>
          <div class="relative">
            <label for="loginPassword" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Password</label>
            <input id="loginPassword" type="password" class="w-full p-3 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-brand-purple pr-10" placeholder="Enter password" required>
            <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5 mt-7" onclick="togglePasswordVisibility('loginPassword', 'loginEyeIcon')">
              <span id="loginEyeIcon">👁️</span>
            </button>
          </div>
          <button type="submit" class="w-full py-3 bg-gradient-to-r from-brand-purple to-brand-pink text-white rounded-lg hover:opacity-90 transition">Login</button>
        </form>
        <p class="text-center mt-4 text-sm text-gray-700 dark:text-gray-300">
          Don't have an account? <button id="showRegister" class="text-brand-purple dark:text-brand-pink font-medium">Register</button>
        </p>
      </div>
      <div id="registerForm" class="hidden">
        <h2 class="text-xl font-semibold mb-4 text-center">Register</h2>
        <form id="registerForm" class="space-y-4">
          <div>
            <label for="registerUsername" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Username</label>
            <input id="registerUsername" type="text" class="w-full p-3 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-brand-purple" placeholder="Enter username" required>
          </div>
          <div class="relative">
            <label for="registerPassword" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Password</label>
            <input id="registerPassword" type="password" class="w-full p-3 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-brand-purple pr-10" placeholder="Enter password" required oninput="validatePassword('registerPassword', 'passwordNotes')">
            <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5 mt-7" onclick="togglePasswordVisibility('registerPassword', 'registerEyeIcon')">
              <span id="registerEyeIcon">👁️</span>
            </button>
          </div>
          <div id="passwordNotes" class="text-sm text-gray-600 dark:text-gray-400">
            <p>Password must contain:</p>
            <ul class="list-disc list-inside">
              <li id="lengthNote">At least 8 characters</li>
              <li id="upperCaseNote">1 uppercase letter</li>
              <li id="lowerCaseNote">1 lowercase letter</li>
              <li id="specialCharNote">1 special character (!@#$%^&*.)</li>
            </ul>
          </div>
          <button type="submit" class="w-full py-3 bg-gradient-to-r from-brand-purple to-brand-pink text-white rounded-lg hover:opacity-90 transition">Register</button>
        </form>
        <p class="text-center mt-4 text-sm text-gray-700 dark:text-gray-300">
          Already have an account? <button id="showLogin" class="text-brand-purple dark:text-brand-pink font-medium">Login</button>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Database Initialization
    let db = JSON.parse(localStorage.getItem('Finance')) || { users: [], transactions: {} };

    // Toggle Password Visibility
    function togglePasswordVisibility(inputId, eyeIconId) {
      const input = document.getElementById(inputId);
      const eyeIcon = document.getElementById(eyeIconId);
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.textContent = '👁️‍🗨️'; // Open eye
      } else {
        input.type = 'password';
        eyeIcon.textContent = '👁️'; // Closed eye
      }
    }

    // Password Validation
    function validatePassword(inputId, notesId) {
      const password = document.getElementById(inputId).value;
      const notes = document.getElementById(notesId);

      const minLength = password.length >= 8;
      const hasUpperCase = /[A-Z]/.test(password);
      const hasLowerCase = /[a-z]/.test(password);
      const hasSpecialChar = /[!@#$%^&*]/.test(password);

      // Update notes
      document.getElementById('lengthNote').style.color = minLength ? 'green' : 'red';
      document.getElementById('upperCaseNote').style.color = hasUpperCase ? 'green' : 'red';
      document.getElementById('lowerCaseNote').style.color = hasLowerCase ? 'green' : 'red';
      document.getElementById('specialCharNote').style.color = hasSpecialChar ? 'green' : 'red';

      // Enable/disable register button
      const registerButton = document.querySelector('#registerForm button[type="submit"]');
      if (minLength && hasUpperCase && hasLowerCase && hasSpecialChar) {
        registerButton.disabled = false;
      } else {
        registerButton.disabled = true;
      }
    }

    // Login Function
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      const user = db.users.find(u => u.username === username && u.password === password);
      if (user) {
        localStorage.setItem('currentUser', username);
        Swal.fire('Success', 'Login successful!', 'success').then(() => {
          window.location.href = 'index.html'; // Redirect to main app
        });
      } else {
        Swal.fire('Error', 'Invalid username or password', 'error');
      }
    });

    // Register Function
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('registerUsername').value;
      const password = document.getElementById('registerPassword').value;

      if (db.users.some(u => u.username === username)) {
        Swal.fire('Error', 'Username already exists', 'error');
        return;
      }

      db.users.push({ username, password });
      db.transactions[username] = [];
      localStorage.setItem('Finance', JSON.stringify(db));
      Swal.fire('Success', 'Registration successful!', 'success');
      showLoginForm();
    });

    // Toggle Login/Register Forms
    document.getElementById('showRegister').addEventListener('click', () => {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
    });

    document.getElementById('showLogin').addEventListener('click', () => {
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
    });
  </script>
</body>
</html>
